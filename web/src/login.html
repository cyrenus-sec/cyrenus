<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyrenus | Secure Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-brand-dark text-gray-200 font-sans antialiased min-h-screen flex items-center justify-center overflow-x-hidden px-4">
    <!-- Subtle background accents -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden opacity-25">
        <div class="absolute -top-[10%] -left-[10%] w-[45%] h-[45%] bg-cyan-500/20 blur-[120px] rounded-full animate-pulse"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[45%] h-[45%] bg-blue-600/20 blur-[120px] rounded-full animate-pulse" style="animation-delay: 2s"></div>
    </div>

    <div class="w-full max-w-md relative z-10 py-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500/20 to-blue-600/20 border border-cyan-500/30 mb-4">
                <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h1 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 tracking-tight mb-1">
                CYRENUS
            </h1>
            <p class="text-gray-400 text-xs font-semibold tracking-widest uppercase">eBPF / XDP DDoS &amp; Host Defense</p>
        </div>

        <div class="bg-brand-light/70 backdrop-blur-xl border border-gray-800 rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-1">Administrator Sign In</h2>
            <p class="text-xs text-gray-400 mb-6">Sign in to manage kernel filters, attack mitigation, and Tetragon policies.</p>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                        Username
                    </label>
                    <input id="username" name="username" type="text" autocomplete="username" required
                        class="w-full bg-brand-dark/70 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all placeholder-gray-600"
                        placeholder="admin">
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="w-full bg-brand-dark/70 border border-gray-700 rounded-xl pl-4 pr-16 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all placeholder-gray-600"
                            placeholder="••••••••">
                        <button type="button" id="togglePassword"
                            class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-gray-400 hover:text-cyan-400 transition">
                            Show
                        </button>
                    </div>
                </div>

                <div id="errorBox"
                    class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center animate-shake"
                    role="alert">
                    <span id="errorText"></span>
                </div>

                <button id="submitBtn" type="submit"
                    class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition-all shadow-lg hover:shadow-cyan-500/20 flex items-center justify-center gap-2 active:scale-[0.99]">
                    <span id="submitLabel">Access Dashboard</span>
                    <span id="submitSpinner"
                        class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                </button>
            </form>
        </div>

        <div class="mt-6 text-center">
            <p class="text-xs text-gray-500">Cyrenus Protection Engine v2.0 &bull; Local Authentication</p>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePassword');
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');
            const submitLabel = document.getElementById('submitLabel');
            const submitSpinner = document.getElementById('submitSpinner');

            function showError(msg) {
                errorText.textContent = msg;
                errorBox.classList.remove('hidden');
            }

            function setLoading(loading) {
                submitBtn.disabled = loading;
                submitLabel.textContent = loading ? 'Signing in...' : 'Access Dashboard';
                submitSpinner.classList.toggle('hidden', !loading);
            }

            // Redirect automatically if an active token is already valid
            const existingToken = localStorage.getItem('token');
            if (existingToken) {
                fetch('/api/v1/auth/verify', {
                    headers: { 'Authorization': 'Bearer ' + existingToken }
                }).then((res) => {
                    if (res.ok) {
                        window.location.replace('/index.html');
                    } else {
                        localStorage.removeItem('token');
                    }
                }).catch(() => {});
            }

            toggleBtn.addEventListener('click', () => {
                const isPwd = passwordInput.type === 'password';
                passwordInput.type = isPwd ? 'text' : 'password';
                toggleBtn.textContent = isPwd ? 'Hide' : 'Show';
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.classList.add('hidden');
                setLoading(true);

                try {
                    const res = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: usernameInput.value.trim(),
                            password: passwordInput.value
                        })
                    });
                    let data = {};
                    try { data = await res.json(); } catch (_) {}

                    if (res.ok && data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('username', data.username || usernameInput.value.trim() || 'Admin');
                        window.location.href = '/index.html';
                        return;
                    }
                    if (res.status === 429) {
                        const retrySec = res.headers.get('Retry-After') || data.retry_after_sec || '';
                        showError(data.error || (retrySec ? `Too many attempts. Retry in ${retrySec}s.` : 'Too many login attempts. Please wait.'));
                        return;
                    }
                    showError(data.error || 'Invalid username or password');
                } catch (_) {
                    showError('Network error. Unable to reach Cyrenus backend.');
                } finally {
                    setLoading(false);
                }
            });
        })();
    </script>
</body>

</html>
