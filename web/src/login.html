<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyrenus | Secure Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body
    class="bg-brand-dark text-gray-200 font-sans antialiased h-screen flex items-center justify-center overflow-hidden">
    <!-- Animated background patterns -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden opacity-20">
        <div
            class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-cyan-500/20 blur-[120px] rounded-full animate-pulse">
        </div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-blue-600/20 blur-[120px] rounded-full animate-pulse"
            style="animation-delay: 2s"></div>
    </div>

    <div class="w-full max-w-md p-8 relative z-10" x-data="{ 
        username: '', 
        password: '', 
        error: '', 
        loading: false,
        async handleLogin() {
            this.loading = true;
            this.error = '';
            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: this.username, password: this.password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/index.html';
                } else {
                    this.error = data.error || 'Login failed';
                }
            } catch (e) {
                this.error = 'Network error. Is the server running?';
            } finally {
                this.loading = false;
            }
        }
    }">
        <div class="text-center mb-10">
            <h1
                class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 tracking-tighter mb-2">
                CYRENUS
            </h1>
            <p class="text-gray-400 text-sm font-medium tracking-wide uppercase">Intrusion Prevention System</p>
        </div>

        <div class="bg-brand-light/50 backdrop-blur-xl border border-gray-800 rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-6">Administrator Sign In</h2>

            <form @submit.prevent="handleLogin" class="space-y-6">
                <div>
                    <label
                        class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 px-1">Username</label>
                    <input type="text" x-model="username" required
                        class="w-full bg-brand-dark/50 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all placeholder-gray-600"
                        placeholder="admin">
                </div>

                <div>
                    <label
                        class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 px-1">Password</label>
                    <input type="password" x-model="password" required
                        class="w-full bg-brand-dark/50 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all placeholder-gray-600"
                        placeholder="••••••••">
                </div>

                <template x-if="error">
                    <div
                        class="p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center animate-shake">
                        <span x-text="error"></span>
                    </div>
                </template>

                <button type="submit" :disabled="loading"
                    class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg hover:shadow-cyan-500/20 flex items-center justify-center space-x-2 active:scale-[0.98]">
                    <template x-if="!loading">
                        <span>Access Dashboard</span>
                    </template>
                    <template x-if="loading">
                        <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    </template>
                </button>
            </form>
        </div>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-500">© 2025 Cyrenus Security Systems. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
