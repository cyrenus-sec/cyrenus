# Cyrenus Production Nginx Reverse Proxy Configuration
# Terminates TLS, enforces rate limiting on login/API routes, and proxies HTTP + WebSocket.
# Prerequisite in /etc/cyrenus/cyrenus.conf:
#   bind_address = "127.0.0.1";
#   trusted_proxy = "127.0.0.1";
#   cors_origin = "https://cyrenus.example.com";

limit_req_zone $binary_remote_addr zone=cyrenus_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cyrenus_api:10m rate=120r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cyrenus.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cyrenus.example.com;

    ssl_certificate     /etc/letsencrypt/live/cyrenus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyrenus.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;

    # Brute-force guard on authentication endpoint
    location = /api/v1/auth/login {
        limit_req zone=cyrenus_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authenticated WebSocket telemetry stream (libwebsockets port 8182)
    location /ws {
        proxy_pass http://127.0.0.1:8182/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # General REST API rate limit
    location /api/ {
        limit_req zone=cyrenus_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Embedded UI assets
    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

