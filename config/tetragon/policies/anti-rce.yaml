apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: anti-rce-protection
spec:
  options:
  - name: "disable-kprobe-multi"
    value: "1"
  kprobes:
  # 1. Prevent web servers & app runtimes from spawning shells (common RCE vector)
  # Scoped via matchBinaries so normal system/admin shells are unaffected
  - call: "sys_execve"
    syscall: true
    message: "CRITICAL RCE detected: web/runtime process spawned interactive shell (blocked via Sigkill)"
    args:
    - index: 0
      type: "string"
    selectors:
    - matchBinaries:
      - operator: "In"
        values:
        - "/usr/sbin/nginx"
        - "/usr/sbin/apache2"
        - "/usr/bin/httpd"
        - "/usr/sbin/httpd"
        - "/usr/bin/php-fpm"
        - "/usr/sbin/php-fpm"
        - "/usr/bin/node"
        - "/usr/bin/python3"
        - "/usr/bin/java"
      matchArgs:
      - index: 0
        operator: "In"
        values:
        - "/bin/sh"
        - "/bin/bash"
        - "/bin/dash"
        - "/usr/bin/sh"
        - "/usr/bin/bash"
        - "/usr/bin/dash"
      matchActions:
      - action: Sigkill

  # 2. Detect reverse shell patterns (scoped to runtimes, shells, and network/attack utilities)
  - call: "tcp_connect"
    syscall: false
    message: "WARNING reverse shell or unauthorized outbound tcp_connect detected"
    args:
    - index: 0
      type: "sock"
    selectors:
    - matchBinaries:
      - operator: "In"
        values:
        - "/usr/sbin/nginx"
        - "/usr/sbin/apache2"
        - "/usr/bin/httpd"
        - "/usr/sbin/httpd"
        - "/usr/bin/php-fpm"
        - "/usr/sbin/php-fpm"
        - "/usr/bin/php"
        - "/usr/bin/node"
        - "/usr/bin/python3"
        - "/usr/bin/java"
        - "/usr/bin/ruby"
        - "/bin/sh"
        - "/bin/bash"
        - "/bin/dash"
        - "/bin/zsh"
        - "/bin/ash"
        - "/usr/bin/sh"
        - "/usr/bin/bash"
        - "/usr/bin/nc"
        - "/usr/bin/netcat"
        - "/usr/bin/ncat"
        - "/usr/bin/socat"
      matchArgs:
      - index: 0
        operator: "NotDPort"
        values:
        - "22"
        - "53"
        - "80"
        - "123"
        - "443"
      matchActions:
      - action: Post

  # 3. Detect execution from temporary directories (fileless attacks)
  - call: "sys_execve"
    syscall: true
    message: "CRITICAL RCE detected: fileless execution from temporary directory blocked via Sigkill"
    args:
    - index: 0
      type: "string"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/tmp/"
        - "/dev/shm/"
        - "/var/tmp/"
        - "/run/shm/"
      matchActions:
      - action: Sigkill

  # 4. Detect suspicious interpreters spawned by web processes
  - call: "sys_execve"
    syscall: true
    message: "WARNING suspicious RCE interpreter spawned by web server process"
    args:
    - index: 0
      type: "string"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/usr/bin/python3"
      matchBinaries:
      - operator: "In"
        values:
        - "/usr/sbin/nginx"
        - "/usr/sbin/apache2"
        - "/usr/bin/httpd"
        - "/usr/bin/php-fpm"
      matchActions:
      - action: Post
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/usr/bin/php"
      matchBinaries:
      - operator: "In"
        values:
        - "/usr/sbin/nginx"
        - "/usr/sbin/apache2"
      matchActions:
      - action: Post

  # 5. Detect privilege escalation attempts
  - call: "sys_setuid"
    syscall: true
    message: "WARNING privilege escalation attempt via setuid(0) detected"
    args:
    - index: 0
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "0"
      matchActions:
      - action: Post

  # 6. Monitor common attack/reconnaissance tools
  - call: "sys_execve"
    syscall: true
    message: "WARNING unauthorized attack or reconnaissance binary execution detected"
    args:
    - index: 0
      type: "string"
    selectors:
    - matchArgs:
      - index: 0
        operator: "In"
        values:
        - "/usr/bin/nmap"
        - "/usr/bin/sqlmap"
        - "/usr/bin/ncat"
        - "/usr/bin/socat"
        - "/usr/bin/msfconsole"
      matchActions:
      - action: Post

  # 7. Detect bind shell attempts (listening on unusual ports)
  - call: "inet_listen"
    syscall: false
    return: false
    message: "CRITICAL reverse shell / unauthorized bind shell listener detected"
    args:
    - index: 0
      type: "sock"
    selectors:
    - matchBinaries:
      - operator: "In"
        values:
        - "/bin/bash"
        - "/bin/sh"
        - "/usr/bin/bash"
        - "/usr/bin/sh"
        - "/usr/bin/nc"
        - "/usr/bin/netcat"
        - "/usr/bin/ncat"
        - "/usr/bin/socat"
      matchActions:
      - action: Post

  # 8. Monitor process injection via ptrace
  - call: "sys_ptrace"
    syscall: true
    message: "WARNING process injection attempt via ptrace PTRACE_ATTACH detected"
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "16"
      matchActions:
      - action: Post
